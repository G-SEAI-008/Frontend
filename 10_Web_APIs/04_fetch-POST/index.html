<!doctype html>
<html lang="en" class="scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Post Fetch Example</title>
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-10 font-sans">
    <div class="mx-auto max-w-xl rounded-lg p-8 shadow">
      <!-- Post Display Area -->
      <div id="post-content">
        <h1 id="post-title" class="mb-4 text-2xl font-bold italic">Loading title...</h1>
        <p id="post-body" class="mb-6 text-gray-300">Loading content...</p>
      </div>

      <hr class="my-6" />

      <!-- Simple Comment Form -->
      <form id="comment-form">
        <label class="mb-2 block text-sm font-medium">Leave a comment:</label>
        <textarea
          id="comment-text"
          class="mb-4 w-full rounded border border-gray-300 p-2"
          rows="3"
          placeholder="Type something..."
          required
        ></textarea>
        <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-gray-300 hover:bg-blue-700">
          Post Comment
        </button>
      </form>

      <p id="status-message" class="mt-4 hidden font-medium text-green-600">
        Comment saved locally!
      </p>
    </div>
  </body>
</html>
