<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake Checkout</title>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-gray-50">
    <div id="app" class="w-full max-w-md space-y-4 rounded-xl bg-white p-6 shadow-lg">
      <h1 class="text-center text-2xl font-semibold">Fake Checkout</h1>
      <div class="space-y-4">
        <label class="block">
          <span class="text-gray-700">Price (€)</span>
          <input
            id="price"
            type="number"
            value="100"
            min="0.01"
            step="0.01"
            class="mt-1 block w-full rounded-md border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500"
          />
        </label>
        <label class="block">
          <span class="text-gray-700">Country</span>
          <select
            id="country"
            class="mt-1 block w-full rounded-md border border-gray-300 focus:border-indigo-500 focus:ring-indigo-500"
          >
            <option value="UK">United Kingdom</option>
            <option value="DE" selected>Germany</option>
            <option value="FR">France</option>
          </select>
        </label>
        <button
          id="calculate"
          class="w-full rounded-md bg-indigo-600 px-4 py-2 text-white transition hover:bg-indigo-700"
        >
          Calculate Total
        </button>
      </div>
      <p id="total" class="text-center text-xl font-medium"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
